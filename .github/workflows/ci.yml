name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Release, Debug]
        compiler: [default]
        include:
          - os: ubuntu-latest
            build_type: Release
            compiler: gcc
            cc: gcc-13
            cxx: g++-13

    steps:
      - uses: actions/checkout@v4

      - name: Install zlib (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev ninja-build

      - name: Install ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DLOB_NATIVE_ARCH=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # The synthetic generator means the end-to-end path is exercised in CI
      # without depending on a 3.5 GB download from Nasdaq.
      - name: End-to-end replay on synthetic data
        run: |
          build/itch_gen --out /tmp/ci.itch --messages 400000
          build/lob_replay --data /tmp/ci.itch --match-trials 2000

  sanitizers:
    name: asan + ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y zlib1g-dev ninja-build
      - name: Configure with sanitizers
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLOB_ENABLE_ASAN=ON \
            -DLOB_NATIVE_ARCH=OFF \
            -DLOB_BUILD_BENCHMARKS=OFF
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - name: Replay under sanitizers
        run: |
          build/itch_gen --out /tmp/ci.itch --messages 200000
          build/lob_replay --data /tmp/ci.itch --match-trials 500
